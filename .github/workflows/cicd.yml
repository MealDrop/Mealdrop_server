# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: Node.js CI with Bun

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Bun (instead of Node.js)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Or specify a version like 1.2.0

      # 3. Install dependencies inside the server directory
      # GitHub Actions runs each step in its own isolated shell instance. If you create a separate step just 
      # to run cd server, the next step will completely forget that change and go back to the root folder. 
      # Using working-directory explicitly tells GitHub to execute those exact commands inside your subfolder.
      - name: Install dependencies
        working-directory: ./server
        run: bun ci

      # 4. Run tests inside the server directory
      - name: Run Tests
        working-directory: ./server
        run: bun test
